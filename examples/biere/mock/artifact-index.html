<title>Mousse</title>
<meta name="description" content="Mousse, l'appli des amateurs de bière : le vrai front, avec un faux serveur dans la page.">
<link rel="stylesheet" href="app.css">
<style>
  /* Le bundle de Mousse pose ses propres styles ; cette page ne fait que l'héberger et ajoute une barre de démo. */
  :root { --demo-bg: #2D6A4F; --demo-fg: #F4F1EA; --demo-line: #1D1C1A; color-scheme: light; }
  html, body { background: #F4F1EA; }
  body { margin: 0; }
  .demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px;
    padding: 4px max(12px, env(safe-area-inset-left, 0px)) 4px max(12px, env(safe-area-inset-right, 0px));
    background: var(--demo-bg); color: var(--demo-fg); border-bottom: 2px solid var(--demo-line);
    font: 600 12px/1.3 "Plus Jakarta Sans", system-ui, sans-serif; }
  .demo-bar span { min-width: 0; }
  .demo-bar button { flex: none; min-height: 24px; padding: 2px 10px; border: 2px solid var(--demo-line); border-radius: 8px;
    background: var(--demo-fg); color: var(--demo-line); font: inherit; cursor: pointer; }
  .demo-bar button:focus-visible { outline: 3px solid #E9A825; outline-offset: 2px; }
</style>
<div class="demo-bar" role="note">
  <span>Démo : données fictives, gardées dans votre navigateur</span>
  <button type="button" id="demo-reset">Réinitialiser</button>
</div>
<div id="root"></div>
<script src="seed-data.js"></script>
<script src="mock-api.js"></script>
<script>
  document.getElementById("demo-reset").addEventListener("click", function () {
    try { if (window.__mockReset) window.__mockReset(); } catch (e) { /* ignoré */ }
    try { localStorage.removeItem("mousse.currentUserId"); } catch (e) { /* ignoré */ }
    location.reload();
  });
</script>
<script type="module" src="app.js"></script>
